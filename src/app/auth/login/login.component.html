<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Login</h2>
  
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" placeholder="email@example.com">
            </div>
  
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" formControlName="password" placeholder="••••••••">
            </div>
  
            <button type="submit" class="btn btn-success w-100" [disabled]="loginForm.invalid">Login</button>
  
            <div class="text-center mt-3">
              <small>Don't have an account?<a routerLink="/register">Register here</a>
              </small>

            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
