<div class="header-green text-center text-white py-5">
  <h2 class="fw-bold">Choisissez un modèle de CV</h2>
</div>

<div class="container mt-5">
  <div class="row g-4 justify-content-center">
    <div class="col-md-4" *ngFor="let template of templates">
      <div class="card h-100 shadow template-card" (click)="onSelectTemplate(template)">
        <img [src]="template.img" alt="Template Preview" class="card-img-top img-fluid">
        <div class="card-body text-center">
          <h5 class="card-title">{{ template.name }}</h5>
        </div>
      </div>
    </div>
  </div>
</div>
